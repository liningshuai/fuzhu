[project]
name = "binglin-tianxia-helper"
version = "0.1.0"
description = "Local ADB and image-recognition automation helper for Binglin Tianxia"
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.0",
    "httpx>=0.26.0",
    "rapidocr_onnxruntime>=1.3.24",
]

[tool.uv]
package = false
